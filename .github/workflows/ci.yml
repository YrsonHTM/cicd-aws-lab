name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: yersonhtm

jobs:
  ci:
    name: Test, build and publish images
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker version

      - name: Run backend tests
        run: |
          docker run --rm \
            -v "$PWD/github/backend:/app" \
            -w /app \
            -e PYTHONPATH=/app \
            -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.12-slim \
            sh -c "pip install --no-cache-dir -r requirements.txt && pytest -p no:cacheprovider"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./github/frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./github/backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./github/db
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/database:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/database:latest
